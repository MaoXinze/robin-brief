[project]
name = "robin-brief"
version = "0.1.0"
description = "知更 Robin — 多 Agent 协作的 AI 行业每日早报系统（LangGraph 编排）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Robin Brief" }]
keywords = ["multi-agent", "langgraph", "daily-brief", "llm", "deepseek"]

[project.scripts]
robin = "robin.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robin = ["prompts/*.txt", "render/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
